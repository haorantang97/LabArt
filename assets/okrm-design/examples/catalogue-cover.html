<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vessels — cover</title>
<style>
  /* Derived (see derivation-sheet.html): the cover is the same grey uncoated stock as the
     text, self-cover, black ink only. It is laid out as the museum's record card: a block
     of fields top-left in the label grotesk, and the accession range as the one monument,
     starting from the left margin with its baseline in the upper third. Nothing else. */
  html, body { margin: 0; background: #d9d6cf; }
  .desk { width: 1400px; height: 1000px; display: grid; place-items: center; }
  .book { position: relative; width: 638px; height: 806px; background: #B9B7B2; color: #111;
          font-family: Arial, "Liberation Sans", Helvetica, sans-serif;
          box-shadow: 0 1px 0 #8f8d88, 4px 0 0 -1px #a7a5a0; }
  .fields { position: absolute; left: 6%; top: 6%; font-size: 12px; line-height: 1.55; letter-spacing: 0.02em; }
  .fields div { display: grid; grid-template-columns: 110px 1fr; border-top: 1px solid #111; padding: 3px 0 2px; width: 300px; }
  .fields div:last-child { border-bottom: 1px solid #111; }
  .fields span:first-child { text-transform: uppercase; font-size: 10px; letter-spacing: 0.08em; padding-top: 2px; }
  .range { position: absolute; left: 6%; top: 29.5%; font-size: 81px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .title { position: absolute; left: 6%; bottom: 7%; font-family: "Times New Roman", Times, "Liberation Serif", serif; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; line-height: 1.6; }
  .corner { position: absolute; right: 6%; bottom: 7%; font-size: 12px; letter-spacing: 0.02em; text-align: right; line-height: 1.55; }
</style>
</head>
<body>
<div class="desk">
  <div class="book">
    <div class="fields">
      <div><span>Record</span><span>Vessels, 1890–2024</span></div>
      <div><span>Entries</span><span>60 · accession order</span></div>
      <div><span>Maker</span><span>— (not recorded)</span></div>
      <div><span>Shown</span><span>Two cities, nine months apart</span></div>
    </div>
    <div class="range">001–060</div>
    <div class="title">Vessels</div>
    <div class="corner">Museum of Applied Arts<br>One run · 1,200 copies</div>
  </div>
</div>
</body>
</html>
