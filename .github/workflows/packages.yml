name: Package boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B scripts/check_packages.py
      - run: python3 -B -m unittest discover -s tests/deadpan-doodles -v
      - run: python3 -B -m unittest discover -s tests/okrm-design -v
